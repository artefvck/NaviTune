[package]
name = "pptool"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Cross-Platform SoftPowerPlayTable (SPPT) Editor for RDNA2"

[dependencies]
egui = { version = "0.29", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[package.metadata.bundle]
name = "NaviTune"
identifier = "com.navitune.pptool"
version = "1.0.0"
resources = []
copyright = "Copyright (c) 2026 NaviTune Contributors"
category = "public.app-category.utilities"
short_description = "Cross-Platform AMD RDNA 2 Soft PowerPlay Table Editor"
long_description = """
NaviTune (pptool) is a native Rust GUI editor for decoding, modifying, validating,
and exporting AMD Radeon RDNA 2 Soft PowerPlay Tables across macOS, Windows, and Linux.
"""
