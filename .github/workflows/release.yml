name: Build & Release Cross-Platform

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-universal:
    name: macOS Universal (arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS Universal .app & .dmg
        run: chmod +x build_macos.sh && ./build_macos.sh
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaviTune-macOS-Universal
          path: dist/*.dmg

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows release .zip
        shell: pwsh
        run: .\build_windows.ps1
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaviTune-Windows-x86_64
          path: dist/*.zip

  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI & GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux release .tar.gz
        run: chmod +x build_linux.sh && ./build_linux.sh
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaviTune-Linux-x86_64
          path: dist/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-macos-universal, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
